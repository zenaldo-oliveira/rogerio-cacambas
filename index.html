<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1a2e" />
    <title>Rogério Caçambas | Aluguel de caçambas para obras e reformas</title>
    <meta
      name="description"
      content="Aluguel de caçambas e retirada de entulho para obras e reformas. Peça seu orçamento pelo WhatsApp."
    />
    <!--
      Animações de entrada: uma vez por visita (aba) e nunca com movimento reduzido.
      Roda antes da pintura para não haver "piscada". Sem esta classe, todo o conteúdo
      aparece direto (inclusive se o JavaScript falhar).
    -->
    <script>
      try {
        var semMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!semMovimento && sessionStorage.getItem('rc-entrada') !== '1') {
          document.documentElement.classList.add('animar-entrada')
          sessionStorage.setItem('rc-entrada', '1')
        }
      } catch (e) {
        /* sessionStorage indisponível (ex.: navegação privada restrita): segue sem animação de entrada */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
