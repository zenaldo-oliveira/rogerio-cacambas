<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1a2e" />
    <title>Rogério Caçambas | Aluguel de caçambas em Cuiabá – MT</title>
    <meta
      name="description"
      content="Aluguel de caçambas de 3 a 6 m³ com entrega e retirada de entulho para obras e reformas em Cuiabá – MT. Peça seu orçamento pelo WhatsApp."
    />
    <!--
      Prévia de compartilhamento (WhatsApp, Facebook, X). Com VITE_SITE_URL definida no build,
      o vite.config.ts acrescenta a URL canônica e torna og:url e og:image absolutos.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Rogério Caçambas" />
    <meta property="og:title" content="Rogério Caçambas | Aluguel de caçambas em Cuiabá – MT" />
    <meta
      property="og:description"
      content="Caçambas de 3 a 6 m³ com entrega e retirada de entulho. Peça seu orçamento pelo WhatsApp."
    />
    <meta property="og:image" content="/compartilhamento.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Caminhões vermelho e azul da Rogério Caçambas" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Animações de entrada: uma vez por visita (aba) e nunca com movimento reduzido.
      Roda antes da pintura para não haver "piscada". Sem esta classe, todo o conteúdo
      aparece direto (inclusive se o JavaScript falhar).
    -->
    <script>
      try {
        var semMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!semMovimento && sessionStorage.getItem('rc-entrada') !== '1') {
          document.documentElement.classList.add('animar-entrada')
          sessionStorage.setItem('rc-entrada', '1')
        }
      } catch (e) {
        /* sessionStorage indisponível (ex.: navegação privada restrita): segue sem animação de entrada */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
